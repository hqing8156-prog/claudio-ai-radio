<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101614">
    <meta name="description" content="A local AI radio console for NetEase playlists, lyrics, playback queue, and DeepSeek-powered music chat.">
    <meta property="og:title" content="Claudio AI Radio">
    <meta property="og:description" content="A private AI radio console for playlists, lyrics, and music chat.">
    <meta property="og:type" content="website">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css?v=202">
    <title>Claudio AI Radio</title>
  </head>
  <body>
    <a class="skip-link" href="#profile">&#x8DF3;&#x5230;&#x5185;&#x5BB9;</a>
    <main class="shell">
      <section class="player" aria-label="AI radio player">
        <div class="cover" id="cover">
          <img id="coverArt" class="cover-art" alt="">
          <div class="disc">
            <span></span>
          </div>
          <canvas id="scope" width="320" height="120" aria-hidden="true"></canvas>
        </div>

        <div class="track">
          <p id="mood">Local Radio</p>
          <h1 id="title">Claudio AI Radio</h1>
          <h2 id="artist">Local Demo</h2>
          <div class="track-album" id="album"></div>
          <div class="library-count" id="libraryCount"></div>
        </div>

        <div class="host" hidden>
          <p id="hostLine"></p>
        </div>

        <div class="controls">
          <button id="favoritePlaylistBtn" class="favorite-playlist-button" aria-label="Add to NetEase playlist" title="Add to NetEase playlist">+</button>
          <div id="favoritePlaylistMenu" class="favorite-playlist-menu hidden" role="menu"></div>
          <button id="modeBtn" class="mode-button" aria-label="&#x5207;&#x6362;&#x64AD;&#x653E;&#x65B9;&#x5F0F;" title="&#x5207;&#x6362;&#x64AD;&#x653E;&#x65B9;&#x5F0F;">&#x21E5;</button>
          <button id="prevBtn" class="icon-button" aria-label="Previous track" title="Previous">&#x2039;</button>
          <button id="playBtn" class="play" aria-label="Play" title="Play">&#x25B6;</button>
          <button id="nextBtn" class="icon-button" aria-label="Next track" title="Next">&#x203A;</button>
          <button id="likeBtn" class="like-current" aria-label="&#x7EA2;&#x5FC3;&#x5F53;&#x524D;&#x6B4C;&#x66F2;" title="&#x7EA2;&#x5FC3;&#x5230;&#x7F51;&#x6613;&#x4E91;">&#x2661;</button>
          <button id="sequenceBtn" class="sequence-button" aria-label="&#x64AD;&#x653E;&#x5E8F;&#x5217;" title="&#x64AD;&#x653E;&#x5E8F;&#x5217;"></button>
        </div>

        <div class="progress">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>

        <nav class="tabs" aria-label="Views">
          <button data-view="playlist">&#x6B4C;&#x5355;</button>
          <button class="active" data-view="profile">&#x6B4C;&#x8BCD;</button>
          <button data-view="songid">&#x5531;&#x7247;&#x673A;</button>
          <button data-view="chat">&#x804A;&#x5929;</button>
        </nav>
      </section>

      <section class="panel panel-scroll hidden" id="playlist" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Playlist</h3>
            <span id="playlistMeta">loading</span>
          </div>
          <form class="playlist-search" id="playlistSearch">
            <input id="playlistInput" autocomplete="off" placeholder="&#x641C;&#x7D22;&#x6B4C;&#x66F2;&#x3001;&#x6B4C;&#x624B;&#x3001;&#x4E13;&#x8F91;">
          </form>
        </div>
        <div class="playlist-list" id="playlistList"></div>
        <div class="playlist-pager">
          <button id="playlistPrev" type="button">&#x4E0A;&#x4E00;&#x9875;</button>
          <span id="playlistPage">1 / 1</span>
          <button id="playlistNext" type="button">&#x4E0B;&#x4E00;&#x9875;</button>
        </div>
      </section>

      <section class="panel panel-scroll lyrics-panel" id="profile" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Lyrics</h3>
            <span id="weather">weather</span>
          </div>
        </div>
        <div class="lyric-stage" aria-label="Lyrics">
          <p id="currentLyric">&#x6682;&#x65E0;&#x6B4C;&#x8BCD;</p>
          <small id="nextLyric"></small>
          <div class="lyric-list" id="lyricList" aria-live="polite"></div>
        </div>
        <div class="profile-cache" aria-hidden="true">
          <div id="tasteList" class="chips"></div>
          <p class="profile-summary" id="profileSummary"></p>
          <div class="history" id="history"></div>
        </div>
      </section>

      <section class="panel panel-scroll hidden" id="songid" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>SongID</h3>
            <span>NetEase</span>
          </div>
          <form class="songid-search" id="songidSearch">
            <input id="songidInput" autocomplete="off" placeholder="&#x60F3;&#x542C;&#x4EC0;&#x4E48;&#x6B4C;&#xFF1F;&#x4E5F;&#x53EF;&#x4EE5;&#x7C98;&#x8D34;&#x7F51;&#x6613;&#x4E91;&#x6B4C;&#x66F2;ID">
            <button type="submit">&#x641C;&#x7D22;</button>
          </form>
          <div class="source-cards">
            <button type="button" class="source-card local-library" id="localPlaylistBtn" data-source="local">
              <strong>&#x6211;&#x7684;&#x559C;&#x6B22;</strong>
            </button>
            <button type="button" class="source-card daily" id="dailySourceBtn" data-source="daily">
              <strong>&#x6BCF;&#x65E5;&#x63A8;&#x8350;</strong>
            </button>
            <button type="button" class="source-card radar" id="fmSourceBtn" data-source="personal_fm">
              <strong>&#x79C1;&#x4EBA;&#x96F7;&#x8FBE;</strong>
            </button>
            <button type="button" class="source-card import-playlist-source" id="importPlaylistBtn" data-source="import-playlist">
              <strong>+</strong>
            </button>
          </div>
          <div class="songid-stage hidden" id="songidStage">
            <div class="songid-toolbar">
              <div class="songid-topic">
                <button type="button" id="songidBack" class="songid-back" aria-label="&#x8FD4;&#x56DE;&#x5531;&#x7247;&#x673A;&#x9996;&#x9875;">&#x2039;</button>
                <span id="songidMeta">&#x9009;&#x62E9;&#x4E00;&#x6279;&#x7F51;&#x6613;&#x4E91;&#x6B4C;&#x66F2;</span>
              </div>
              <div class="songid-actions">
                <button type="button" id="songidPlayAll" disabled>&#x64AD;&#x653E;&#x5168;&#x90E8;</button>
                <button type="button" id="songidActionMenuBtn" class="songid-action-menu-button" aria-label="&#x9009;&#x62E9;&#x64AD;&#x653E;&#x65B9;&#x5F0F;" aria-expanded="false" disabled>&#x25BE;</button>
                <div id="songidActionMenu" class="songid-action-menu hidden" role="menu">
                  <button type="button" data-action="append" role="menuitem">&#x8FFD;&#x52A0;&#x64AD;&#x653E;</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="songid-results-heading hidden" id="songidResultsHeading">&#x6B4C;&#x66F2;&#x5217;&#x8868;</div>
        <div class="songid-results hidden" id="songidResults"></div>
      </section>

      <section class="panel chat-panel hidden" id="chat" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Chat</h3>
            <span>memory on</span>
          </div>
          <div class="chat-memory" id="chatMemory"></div>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" autocomplete="off" placeholder="&#x804A;&#x804A;&#x5929;&#xFF0C;&#x6216;&#x8BF4;&#xFF1A;&#x6211;&#x60F3;&#x542C; Oh Wonder &#x7684;&#x6B4C;">
          <button type="submit">&#x53D1;&#x9001;</button>
        </form>
      </section>

    </main>
    <script src="/app.js?v=202" type="module"></script>
  </body>
</html>
