<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101614">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <title>Claudio AI Radio</title>
  </head>
  <body>
    <main class="shell">
      <section class="player" aria-label="AI radio player">
        <div class="statusbar">
          <span id="clock">00:00</span>
          <span id="signal">LOCAL FM</span>
        </div>

        <div class="cover" id="cover">
          <img id="coverArt" class="cover-art" alt="">
          <div class="disc">
            <span></span>
          </div>
          <canvas id="scope" width="320" height="120" aria-hidden="true"></canvas>
        </div>

        <div class="track">
          <p id="mood">late-night synth</p>
          <h1 id="title">Claudio AI Radio</h1>
          <h2 id="artist">Local Demo</h2>
          <div class="library-count" id="libraryCount">0 tracks</div>
        </div>

        <div class="host">
          <span>AI DJ</span>
          <p id="hostLine">正在连接本地电台。</p>
        </div>

        <div class="lyrics" aria-label="Lyrics">
          <span>Lyrics</span>
          <p id="currentLyric">暂无歌词</p>
          <small id="nextLyric"></small>
        </div>

        <div class="controls">
          <button id="prevBtn" class="icon-button" aria-label="Previous track" title="Previous">‹</button>
          <button id="playBtn" class="play" aria-label="Play" title="Play">▶</button>
          <button id="nextBtn" class="icon-button" aria-label="Next track" title="Next">›</button>
        </div>

        <div class="progress">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>

        <nav class="tabs" aria-label="Views">
          <button class="active" data-view="profile">Profile</button>
          <button data-view="chat">Chat</button>
          <button data-view="plan">Plan</button>
        </nav>
      </section>

      <section class="panel panel-scroll" id="profile" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Library Profile</h3>
            <span id="weather">weather</span>
          </div>
          <div id="tasteList" class="chips"></div>
          <p class="profile-summary" id="profileSummary"></p>
        </div>
        <div class="history" id="history"></div>
      </section>

      <section class="panel panel-scroll hidden" id="chat" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Ask The Station</h3>
            <span>local brain</span>
          </div>
          <div class="chat-memory" id="chatMemory"></div>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" autocomplete="off" placeholder="">
          <button type="submit">Send</button>
        </form>
      </section>

      <section class="panel panel-scroll hidden" id="plan" data-panel>
        <div class="panel-sticky">
          <div class="panel-head">
            <h3>Today</h3>
            <span>routine hook</span>
          </div>
        </div>
        <pre id="planText"></pre>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
